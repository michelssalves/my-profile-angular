<a class="skip-link" href="#conteudo">{{ i18n.t('nav.skip') }}</a>

<header class="topbar">
  <a class="brand" href="#hero">
    <span class="brand-mark" aria-hidden="true">MA</span>
    <span class="brand-text">
      <strong>Michel Alves</strong>
      <small>{{ i18n.t('brand.role') }}</small>
    </span>
  </a>
  <div class="topbar-actions">
    <nav [attr.aria-label]="i18n.t('nav.label')">
      <a href="#projetos">{{ i18n.t('nav.projects') }}</a>
      <a href="#experiencia">{{ i18n.t('nav.experience') }}</a>
      <a href="#contato">{{ i18n.t('nav.contact') }}</a>
    </nav>
    <button
      class="theme-toggle"
      type="button"
      [title]="themeLabel()"
      [attr.aria-label]="themeLabel()"
      (click)="toggleTheme()"
    >
      <span aria-hidden="true">{{ theme() === 'dark' ? '☀' : '☾' }}</span>
    </button>
  </div>
</header>

<main id="conteudo">
  <app-hero></app-hero>
  <app-projetos></app-projetos>
  <app-sobre></app-sobre>
  <app-contato></app-contato>
</main>
