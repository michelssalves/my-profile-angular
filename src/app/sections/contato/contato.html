<section id="contato" class="block" aria-labelledby="contact-title">
  <div class="tile contact">
    <div class="contact-text">
      <h2 id="contact-title">{{ i18n.t('contact.title') }}</h2>
      <p>{{ i18n.t('contact.lead') }}</p>
    </div>
    <div class="actions">
      <a class="btn whats" [href]="whatsappLink()" target="_blank" rel="noopener">
        <img src="icons/whatsapp-white.svg" alt="" width="20" height="20" />
        {{ i18n.t('contact.whats') }}
      </a>
      <a class="btn secondary" [href]="emailLink()">
        <img src="icons/gmail.svg" alt="" width="20" height="15" />
        {{ i18n.t('contact.email') }}
      </a>
    </div>
    <ul class="contact-links">
      <li><span><img src="icons/whatsapp.svg" alt="" width="14" height="14" />WhatsApp</span><a [href]="whatsappLink()" target="_blank" rel="noopener">{{ contact.phoneDisplay }}</a></li>
      <li><span><img src="icons/gmail.svg" alt="" width="14" height="11" />E-mail</span><a [href]="emailLink()">{{ contact.email }}</a></li>
      <li><span>LinkedIn</span><a [href]="contact.linkedin" target="_blank" rel="noopener">in/michel-alves</a></li>
      <li><span>GitHub</span><a [href]="contact.github" target="_blank" rel="noopener">michelssalves</a></li>
    </ul>
  </div>
  <p class="footer">© {{ year }} Michel Alves · {{ i18n.t('footer.text') }}</p>
</section>
